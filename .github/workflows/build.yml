name: Build FlashTrans

on:
  # 手动触发：仓库 → Actions → Build FlashTrans → Run workflow
  workflow_dispatch:
  # 打 tag 时自动触发（如 v2.4.0），配合 release 上传
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # package-lock.json 在 flashtrans-next/ 子目录，不在仓库根目录
          cache-dependency-path: flashtrans-next/package-lock.json

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: flashtrans-next/src-tauri

      - name: Install frontend dependencies
        working-directory: flashtrans-next
        run: npm ci

      # llama-cpp-2 的 build.rs 需要 libclang 与 CMake（runner 自带 cmake，libclang 保险起见显式装）
      - name: Install LLVM (libclang)
        run: choco install llvm --no-progress -y

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 项目在仓库的 flashtrans-next 子目录
          projectPath: flashtrans-next
          # 手动 workflow_dispatch 时不创建 Release（仅产 artifact）
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('FlashTrans {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashtrans-windows
          if-no-files-found: error
          path: |
            flashtrans-next/src-tauri/target/release/bundle/**/*.exe
            flashtrans-next/src-tauri/target/release/FlashTrans.exe
