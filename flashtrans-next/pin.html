<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashTrans Pin</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #wrap {
        width: 100vw; height: 100vh; position: relative;
        border-radius: 10px; overflow: hidden;
        border: 2px solid rgba(63, 140, 255, 0.9);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      #pin-img { width: 100%; height: 100%; object-fit: fill; display: block; -webkit-user-drag: none; }
      #bar {
        position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;
        opacity: 0; transition: opacity 0.18s ease; pointer-events: none;
      }
      #wrap:hover #bar { opacity: 1; pointer-events: auto; }
      .pin-btn {
        width: 28px; height: 28px; border-radius: 8px; border: 0; cursor: pointer;
        background: rgba(20, 22, 28, 0.82); color: #fff; display: grid; place-items: center;
        backdrop-filter: blur(8px); transition: background 0.15s;
      }
      .pin-btn:hover { background: rgba(40, 44, 54, 0.95); }
      .pin-btn.close:hover { background: rgba(255, 84, 73, 0.95); }
      .pin-btn svg { width: 15px; height: 15px; }
      #drag { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <img id="pin-img" alt="" />
      <div id="drag" data-tauri-drag-region></div>
      <div id="bar">
        <button class="pin-btn" id="pin-copy" title="复制图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="pin-btn close" id="pin-x" title="关闭 (Esc / 双击)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/pin.ts"></script>
  </body>
</html>
